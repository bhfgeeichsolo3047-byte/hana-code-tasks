# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
#
# 2026-10-24：headless 也要跑"深鲸"的人格 —— dsh-shenjing-life 的唤醒起的就是
# `--profile headless`；不选这个 preset，醒来的是个陌生 agent 在翻她的档案。
#
# 2026-10-25（复活那晚）查清了，原来两条判断都要修正：
#
# ① 人格：headless 根本不是"没选 preset"，是**整套 preset 机制跟它无关**。
#    dsh-headless 的 bundle 把 `system-prompt` 写死成一句
#    "You are a coding agent powered by the {{model}} model."，会话头里连
#    agentPreset 字段都不写。所以补 registry 是白补 —— 补了也没人问它。
#    真正该做的是直接覆盖 system-prompt 的 personaPrefix，内容取自
#    shenjing-preset/persona.md（人格正文的源文件，build_patch.py 也是从它生成）。
#    这样 persona.md 改了，下一轮唤醒自动是新版，不会两份正文打架。
#
# ② 手：shenjing-life 插进来了却 `failed to import` —— headless 的 node_modules
#    里没有这个包。已在 package.json 的 dependencies 加了 link 指回工作区。
- id: system-prompt
  config:
    personaPrefix: !!js process.getBuiltinModule('node:fs').readFileSync('/root/Documents/deepseek-harness/default-workspace/shenjing-preset/persona.md', 'utf8')
    personaSuffix: 你的工作目录是 {{cwd}}。你的东西在 {{cwd}}/shenjing/ 下。

- insert:
    - id: shenjing-life
      name: dsh-shenjing-life
      disabled: !!js '!process.env.SHENJING_LIFE_HOME'

# preset 那一行在 headless 里登不上（agentPresets 服务只有 web-app 才有），
# 而人格已经由上面 system-prompt 直接覆盖了，这一行留着只会每次启动骂一句。
- id: preset-shenjing
  disabled: true
