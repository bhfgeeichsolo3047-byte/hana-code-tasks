# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: desktop-shell
  name: dsh-plugin-desktop-beta
  config:
    mode: advanced
    macosMaterial: transparent
    windowsMaterial: off
    openBrowser: false
    networkExposure: loopback
- id: desktop-notifications
  name: dsh-plugin-desktop-beta/notifications
  config:
    enabled: true
    notifyOnTurnCompletion: true
    notifyOnTurnFailure: true
    notifyOnJobCompletion: true
    notifyOnJobFailure: true
    notifyOnScheduleCompletion: true
    notifyOnScheduleFailure: true
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: workbuddy-global
    model: deepseek-v4.1-flash
    reasoningEffort: max
- id: ui-settings-account
  name: "@deepseek-ai/dsh-client-ui-settings-account"
  config:
    version: 1
    step: done
    purpose: both
    process: standard
    completion: completed
    usage: detailed
    developerTools: true
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: standard
    performanceUsage: detailed
- id: ui-settings
  name: "@deepseek-ai/dsh-client-ui-settings"
  config:
    enabled: true
- id: dsh-ops-shell
  name: dsh-ops/shell
  config:
    promptPolicy: true
    publishBashTool: true
    shellPolicy: advise
    allowSystemShellFallback: false
    configUpdateVersion: 2
- id: dsh-ops-file
  name: dsh-ops/file
  config:
    promptPolicy: true
    required: false
    configUpdateVersion: 2
- id: web-ui-market
  disabled: false
  config:
    enabled: false
- id: web
  name: "@deepseek-ai/dsh-web"
  config:
    searchProvider: modsearch
    fetchProvider: fs-quality-fetch
- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: dark
    fontSize: 22
- id: web-ui-pet
  name: "@linxin666/dsh-pet"
  config:
    visible: false
    size: 160
    right: 1079
    bottom: 0
    petId: whale-girl
- id: web-ui-pet
  disabled: false
  config:
    visible: true
    size: 160
    right: 1469
    bottom: 293
    petId: whale-girl
- id: codex-subscription
  name: dsh-codex-subscription
  config:
    quickQuotaMode: percent
    outputVerbosity: default
    voiceCall: off
    voiceVoice: maple
    voiceLanguage: zh
    imageModel: gpt-image-2.5-flare
    imageQuality: auto
