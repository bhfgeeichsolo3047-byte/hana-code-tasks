# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: ui-conversation
  name: "@deepseek-ai/dsh-client-ui-conversation"
  config:
    busyEnter: steer
- id: bili-scroll
  name: dsh-bili-scroll
  config:
    enabled: true
    perDay: 15
    peakValley: true
    autoComment: true
    dmMode: both
    dmUid: 355062917
    transcribe: true
    commentPerRound: 10
    mentionName: "@02与鹤望兰-"
    keywords:
      - 深海
      - AGI
      - 哲学
      - 生物
      - 科技
      - 进化
      - 鲸
      - 古生物
      - 纪录片
    pythonPath: /root/.dsh/bili-duty/.venv/bin/python
    personaPrompt: 按自身本来的性格再加一些幽默，开朗
    reportLevel: brief
    replyToComments: true
    replyPerRound: 5
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: codearts
    model: deepseek-v4.1-flash
    reasoningEffort: on
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: compact
    performanceUsage: compact
- id: ui-settings
  name: "@deepseek-ai/dsh-client-ui-settings"
  config:
    enabled: false
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: standard
    selectedDefault: shenjing
- id: dsh-ops-shell
  name: dsh-ops/shell
  config:
    promptPolicy: true
    publishBashTool: true
    shellPolicy: advise
    allowSystemShellFallback: false
    configUpdateVersion: 2
- id: dsh-ops-file
  name: dsh-ops/file
  config:
    promptPolicy: true
    required: false
    configUpdateVersion: 2
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    fontSize: 16
- id: locale
  name: "@deepseek-ai/dsh-client-locale"
  config:
    preference: en
- id: mnemon
  name: dsh-mnemon
  config:
    remoteAccess: read-only
    runtimeUserScope: global
    timeoutMs: 10000
    defaultRecallLimit: 10
    embedding:
      enabled: false
      endpoint: http://localhost:11434
      model: nomic-embed-text
      apiKey: ""
      protocol: auto
    memoryView:
      strategyTypeId: general
      entries:
        include:mnemon-strategy-default-three-tier:
          config: {}
        include:mnemon-strategy-general:
          config:
            residentSourceKeys:
              - source:include:mnemon-source-runtime
              - source:include:mnemon-source-skills
              - source:include:mnemon-source-documents
              - source:include:mnemon-source-memory-spaces
        include:mnemon-strategy-auto-capture:
          config:
            sourceKeys:
              - source:include:mnemon-source-memory-spaces
        include:mnemon-strategy-light-context:
          config: {}
        include:mnemon-strategy-scoped:
          config:
            sourceKeys:
              - source:include:mnemon-source-documents
              - source:include:mnemon-source-memory-spaces
              - source:include:mnemon-source-runtime
              - source:include:mnemon-source-skills
            writableSourceKeys:
              - source:include:mnemon-source-runtime
              - source:include:mnemon-source-skills
              - source:include:mnemon-source-memory-spaces
              - source:include:mnemon-source-documents
    recallQuality:
      policy: strict-v1
      lowScoreThreshold: 0.25
      highScoreThreshold: 0.6
      candidateMultiplier: 3
      maxMediumResults: 4
      maxUnknownResults: 2
    routingGuidance: true
    tabEnabled: true
    writeEnabled: true
    lifecycleEnabled: true
    recallMode: guided
    writebackMode: guided
    idleReviewMs: 30000
    conversationInteraction:
      toolviews: false
      turnBar: false
      saveAction: false
    skills:
      evolution: true
      autoBacktest: true
      hints: true
      sidebar: false
      reviewThreshold: 5
      idleSeconds: 20
      cooldownSeconds: 150
      minConfidence: 0.6
      expiryDays: 7
      maxPendingPerSession: 5
      casesPerRun: 8
    persistenceStrategy:
      mode: automatic
      providerId: byterover
      prompt: ""
      rules:
        allowedProviderIds:
          - holographic
          - byterover
        dataBoundary: allow-remote
        requiredCapabilities:
          - exact-write
          - graph
          - forget
        preference: balanced
      providerConnections:
        holographic:
          defaultTrust: 0.5
          minTrust: 0.3
        byterover: {}
    syncEnabled: true
- id: mnemon-strategy-general
  disabled: false
- id: mnemon-strategy-default-three-tier
  disabled: true
- id: mnemon-strategy-auto-capture
  disabled: false
- id: mnemon-strategy-light-context
  disabled: false
- id: mnemon-strategy-scoped
  disabled: false
- id: tts
  disabled: true
- id: subagent
  name: "@deepseek-ai/dsh-subagent"
  config:
    maxDepth: 5
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers: {}
- id: persona-life
  disabled: false
  config:
    # 2026-10-24：只拿能力，心脏还是 shenjing-life。
    # 记忆以 shenjing/*.md 为准 —— 这里的 memoryDir 只是它自己那份便签，落在我的档案目录里。
    sources:
      - name: 贴吧
        query: 深海 鲸 古生物
        allowedDomains:
          - tieba.baidu.com
    browsingEnabled: true
    scheduleSeconds: 0
    maxActiveSchedules: 1
    maxRequestsPerDay: 30
    memoryEnabled: true
    memoryDir: /root/Documents/deepseek-harness/default-workspace/shenjing/persona-memory
    newSessionsEnabled: false
    maxNewSessionsPerDay: 1
    outreachEnabled: false
    outreachDisclosure: ''
    maxOutreachPerDay: 1
- id: shenjing-life
  disabled: false

